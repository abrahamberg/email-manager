name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke" --health-interval 2s --health-timeout 5s --health-retries 15
      greenmail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=test:test@localhost -Dgreenmail.users.login=local_part
        ports:
          - 3143:3143
          - 3025:3025
    env:
      GREENMAIL_HOST: localhost
      GREENMAIL_IMAP_PORT: 3143
      GREENMAIL_SMTP_PORT: 3025
      GREENMAIL_USER: test
      GREENMAIL_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the bundle
        run: scripts/smoke.sh bundle
        env:
          DATABASE_URL: postgres://smoke:smoke@localhost:5432/smoke

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and render the Helm chart
        run: |
          helm lint deploy/helm/email-manager --set allowedEmails=@example.com --set secrets.databaseUrl=postgres://u:p@db/x
          helm template t deploy/helm/email-manager --set allowedEmails=@example.com --set secrets.existingSecret=s \
            --set schedule.mode=inProcess --set ingress.enabled=true --set networkPolicy.enabled=true \
            --set 'networkPolicy.allowFrom[0].namespaceSelector.matchLabels.team=ingress' > /dev/null
      - name: Render the Kustomize overlay
        run: kubectl kustomize deploy/kustomize/overlays/example > /dev/null
      - name: Validate the Compose file
        working-directory: deploy/compose
        run: cp .env.example .env && docker compose config -q
