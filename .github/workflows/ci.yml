name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=test:test@localhost -Dgreenmail.users.login=local_part
        ports:
          - 3143:3143
          - 3025:3025
    env:
      GREENMAIL_HOST: localhost
      GREENMAIL_IMAP_PORT: 3143
      GREENMAIL_SMTP_PORT: 3025
      GREENMAIL_USER: test
      GREENMAIL_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
