{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "email-manager.fullname" . }}
  labels:
    {{- include "email-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl or secrets.existingSecret is required" .Values.secrets.databaseUrl | quote }}
  {{- with .Values.secrets.openaiApiKey }}
  openai-api-key: {{ . | quote }}
  {{- end }}
{{- end }}
