image:
  repository: ghcr.io/abrahamberg/email-manager
  # Defaults to the chart appVersion. Pin a sha-xxxxxxx tag in production.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Who may use the panel: full addresses or "@domain", comma separated. Required.
allowedEmails: ""
# The panel's public https address. Needed only for Office 365 / Gmail sign-in.
publicUrl: ""
# Office 365 only: your Entra tenant ID or domain when the app registration is single-tenant.
# Empty means "common", which works only for multi-tenant registrations.
microsoftTenantId: ""
# Report what would happen without changing any mailbox. Set false once you trust it.
dryRun: true
aiDailyBudgetUsd: "0.5"
ai:
  triageModel: ""
  draftModel: ""
# Optional Rspamd, e.g. http://rspamd:11333. Without it the built-in checks are used.
rspamdUrl: ""
extraEnv: []

secrets:
  # Use a Secret you manage (External Secrets, Sealed Secrets, SOPS...). Keys:
  #   database-url (required), openai-api-key (optional),
  #   token-encryption-key and internal-token (optional; otherwise created on the data volume).
  existingSecret: ""
  # Or let the chart create the Secret from these values (fine for trying it out).
  databaseUrl: ""
  openaiApiKey: ""

schedule:
  # cronjob: a Kubernetes CronJob runs the worker. inProcess: the server runs itself on a timer.
  mode: cronjob
  cron: "*/15 * * * *"
  intervalMinutes: 15
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

# Holds the instance keys (sealing key and internal token) and the local embedding
# model cache (about 100 MB). Back it up: losing the key makes stored mailbox secrets
# unreadable. In cronjob mode the server and the job both mount it, so use
# ReadWriteMany, or ReadWriteOnce when they land on the same node (or use inProcess).
# Disabled: the keys must be in the Secret and the model downloads on every start.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteMany
  size: 1Gi
  # Keep the claim on helm uninstall.
  keep: true
  # e.g. argocd.argoproj.io/sync-options: Delete=false
  annotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: email.example.com
  # Put an authenticating proxy in front. For ingress-nginx + oauth2-proxy:
  #   nginx.ingress.kubernetes.io/auth-url: "https://$host/oauth2/auth"
  #   nginx.ingress.kubernetes.io/auth-signin: "https://$host/oauth2/start?rd=$escaped_request_uri"
  #   nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-Email"
  annotations: {}
  tlsSecretName: ""

# Only the auth proxy may reach the panel: the app trusts its X-Auth-Request-Email header.
networkPolicy:
  enabled: false
  # Peers allowed to reach the http port, e.g. the ingress controller's namespace.
  allowFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi
workerResources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 1Gi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
