apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: email-manager
    includeSelectors: true
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - cronjob.yaml
configMapGenerator:
  - name: email-manager-config
    literals:
      - DRY_RUN=true
      - AI_DAILY_BUDGET_USD=0.5
      - DATA_DIR=/data
      - EMBEDDING_CACHE_DIR=/data/models
images:
  - name: email-manager
    newName: ghcr.io/abrahamberg/email-manager
    newTag: latest
