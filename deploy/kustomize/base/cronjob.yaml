apiVersion: batch/v1
kind: CronJob
metadata:
  name: email-manager-worker
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/component: worker
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: worker
              image: email-manager
              args: ["dist/worker.js"]
              envFrom:
                - configMapRef:
                    name: email-manager-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: { name: email-manager, key: database-url }
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef: { name: email-manager, key: openai-api-key, optional: true }
                - name: TOKEN_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef: { name: email-manager, key: token-encryption-key, optional: true }
                - name: INTERNAL_TOKEN
                  valueFrom:
                    secretKeyRef: { name: email-manager, key: internal-token, optional: true }
              resources:
                requests: { cpu: 100m, memory: 384Mi }
                limits: { memory: 1Gi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: data
                  mountPath: /data
          volumes:
            - name: tmp
              emptyDir: {}
            - name: data
              persistentVolumeClaim:
                claimName: email-manager-data
